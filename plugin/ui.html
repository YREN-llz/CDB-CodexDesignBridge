<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        font: 12px/1.4 Inter, system-ui, sans-serif;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding: 14px;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        background: var(--figma-color-bg-secondary);
      }

      .status-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }

      .status-copy strong {
        font-size: 13px;
      }

      .status-detail {
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }

      .status-path {
        overflow: hidden;
        color: var(--figma-color-text-tertiary);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .manage-projects {
        width: auto;
        min-width: 64px;
        height: 30px;
        padding: 0 10px;
        color: var(--figma-color-text);
        background: transparent;
        border: 1px solid var(--figma-color-border);
        font-size: 11px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--figma-color-icon-tertiary);
      }

      .dot.connected {
        background: #22a06b;
      }

      .dot.error {
        background: #e5484d;
      }

      label {
        display: block;
        margin: 10px 0 4px;
        color: var(--figma-color-text-secondary);
      }

      input {
        width: 100%;
        height: 32px;
        padding: 0 9px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        outline: none;
      }

      input:focus {
        border-color: var(--figma-color-border-brand);
      }

      details {
        margin-top: 12px;
        padding: 0 10px 10px;
        border: 1px solid var(--figma-color-border);
        border-radius: 7px;
        background: var(--figma-color-bg-secondary);
      }

      details summary {
        padding: 9px 0;
        color: var(--figma-color-text-secondary);
        cursor: pointer;
        user-select: none;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 0;
      }

      #seed-page,
      #import-page {
        grid-column: auto;
      }

      .pages {
        margin: 0 0 16px;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        overflow: hidden;
      }

      .pages-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--figma-color-bg-secondary);
      }

      .pages-header strong { font-size: 12px; }
      .pages-header span {
        max-width: 70%;
        overflow: hidden;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .page-list {
        max-height: 210px;
        overflow: auto;
      }

      .page-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 9px 10px;
        border-top: 1px solid var(--figma-color-border);
        cursor: pointer;
      }

      .page-row.active { background: var(--figma-color-bg-selected); }
      .page-copy { min-width: 0; display: grid; gap: 2px; }
      .page-copy strong, .page-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .page-copy span { color: var(--figma-color-text-secondary); font-size: 10px; }
      .page-state { color: var(--figma-color-text-secondary); font-size: 10px; }
      .page-state.conflict, .page-state.failed { color: var(--figma-color-text-danger); }
      .page-state.source_changed, .page-state.figma_changed { color: var(--figma-color-text-warning); }

      button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 8px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        font-weight: 600;
        cursor: pointer;
      }

      button.secondary {
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        border: 1px solid var(--figma-color-border);
      }

      #reset-workspace {
        color: var(--figma-color-text-danger);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .result {
        min-height: 36px;
        margin: 12px 0 0;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }

      .visually-hidden {
        display: none;
      }

      dialog {
        width: 340px;
        max-height: 460px;
        padding: 0;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        border-radius: 12px;
      }

      dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
      .project-dialog { padding: 16px; }
      .project-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .project-dialog-header strong { font-size: 13px; }
      .project-dialog-header button { width: auto; height: 30px; padding: 0 10px; }
      .project-help { margin: 8px 0 12px; color: var(--figma-color-text-secondary); font-size: 11px; }
      .project-list { max-height: 250px; overflow: auto; border: 1px solid var(--figma-color-border); border-radius: 8px; }
      .project-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 10px; border-top: 1px solid var(--figma-color-border); }
      .project-row:first-child { border-top: 0; }
      .project-row.active { background: var(--figma-color-bg-selected); }
      .project-copy { min-width: 0; display: grid; gap: 2px; }
      .project-copy strong, .project-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .project-copy span { color: var(--figma-color-text-secondary); font-size: 10px; }
      .project-row button { width: auto; height: 28px; padding: 0 10px; font-size: 10px; }
      .project-status { min-height: 18px; margin: 10px 0 0; color: var(--figma-color-text-secondary); font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="status">
      <span id="status-dot" class="dot"></span>
      <div class="status-copy">
        <strong id="status-text">正在连接 Codex…</strong>
        <span id="status-detail" class="status-detail">请保持对应的 Codex 任务打开</span>
        <span id="project-path" class="status-path" title=""></span>
      </div>
      <button class="manage-projects" id="manage-projects" type="button" disabled>项目</button>
    </div>

    <section class="pages" aria-label="CDB 页面">
      <div class="pages-header">
        <strong>页面</strong>
        <span id="catalog-count">0 个</span>
      </div>
      <div class="page-list" id="catalog-list">
        <div class="page-row"><span></span><span class="status-detail">等待 Codex 页面清单…</span></div>
      </div>
    </section>

    <div class="buttons">
      <button id="seed-page" disabled hidden>Figma → Codex</button>
      <button class="secondary" id="import-page" disabled hidden>Codex → Figma</button>
      <button id="capture" disabled>发送修改给 Codex</button>
      <button class="secondary" id="reset-workspace" title="保留画布和源码，只清除 CDB 页面关联与同步记录" disabled>清除关联</button>
    </div>

    <p id="result" class="result">支持快速同步文字、颜色、字号、间距和圆角。</p>

    <dialog id="project-dialog" aria-label="CDB 项目管理">
      <div class="project-dialog">
        <div class="project-dialog-header">
          <strong>项目管理</strong>
          <button id="create-project" type="button">新建</button>
        </div>
        <p class="project-help">项目数据保存在列表显示的本地目录中。切换项目会重新预检，并保持只有一个活动连接。</p>
        <div class="project-list" id="project-list"></div>
        <p class="project-status" id="project-status"></p>
        <button class="secondary" id="close-projects" type="button">完成</button>
      </div>
    </dialog>

    <div class="visually-hidden" aria-hidden="true">
      <span id="page-count">0</span>
      <span id="asset-count">0</span>
      <span id="feedback-count">0</span>
      <span id="log"></span>
    </div>

    <script>
      const FIGMA_PLUGIN_VERSION = "0.7.0";
      const captureButton = document.getElementById("capture");
      const seedPageButton = document.getElementById("seed-page");
      const importPageButton = document.getElementById("import-page");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const statusDetail = document.getElementById("status-detail");
      const projectPathElement = document.getElementById("project-path");
      const resultElement = document.getElementById("result");
      const catalogList = document.getElementById("catalog-list");
      const catalogCount = document.getElementById("catalog-count");
      const resetWorkspaceButton = document.getElementById("reset-workspace");
      const manageProjectsButton = document.getElementById("manage-projects");
      const projectDialog = document.getElementById("project-dialog");
      const projectList = document.getElementById("project-list");
      const projectStatus = document.getElementById("project-status");
      const createProjectButton = document.getElementById("create-project");
      const closeProjectsButton = document.getElementById("close-projects");
      const pageCount = document.getElementById("page-count");
      const assetCount = document.getElementById("asset-count");
      const feedbackCount = document.getElementById("feedback-count");
      const logElement = document.getElementById("log");

      let socket = null;
      let reconnectTimer = null;
      let pairingTimer = null;
      let shouldReconnect = false;
      let localWorkspace = false;
      let pageSeedTransportVersion = 0;
      let activeSeedRequestId = "";
      let activeImportRequest = false;
      let endpoint = "ws://localhost:9847/ws";
      let token = "";
      let unsentChanges = false;
      let changedPageIds = [];
      let sessionEnded = false;
      let feedbackSaved = 0;
      let activeTaskId = null;
      const completedTasks = new Set();
      const importedAssets = new Set();
      const importedPages = new Set();
      let catalogPages = [];
      let activePageId = "";
      let connectedProjectName = "";
      let connectedProjectKey = "";
      let connectedProjectDir = "";
      let projectCatalog = [];
      let projectActionPending = false;

      manageProjectsButton.addEventListener("click", () => {
        if (socket?.readyState !== WebSocket.OPEN) return;
        projectStatus.textContent = "正在读取项目列表…";
        projectDialog.showModal();
        send({ type: "project.catalog.request" });
      });

      closeProjectsButton.addEventListener("click", () => projectDialog.close());

      createProjectButton.addEventListener("click", () => {
        if (projectActionPending) return;
        const requested = window.prompt("项目名称", "Figma Design");
        if (requested === null) return;
        projectActionPending = true;
        projectStatus.textContent = "请选择新项目的本地保存位置…";
        renderProjectCatalog();
        send({ type: "project.create.request", projectName: requested.trim() || "Figma Design" });
      });

      projectList.addEventListener("click", (event) => {
        const button = event.target.closest?.("[data-project-key]");
        if (!button || projectActionPending || button.disabled) return;
        projectActionPending = true;
        projectStatus.textContent = "正在切换项目并重新预检…";
        renderProjectCatalog();
        send({ type: "project.open.request", projectKey: button.dataset.projectKey });
      });

      seedPageButton.addEventListener("click", () => {
        const page = catalogPages.find((candidate) => candidate.id === activePageId);
        if (!page?.acceptsFigmaSeed) return;
        activeSeedRequestId = `figma-seed-${Date.now()}`;
        setStatus("connected", "正在读取选中的 Figma 页面…");
        statusDetail.textContent = "已接收操作，正在检查并打包所选图层";
        resultElement.textContent = "复杂页面可能需要几秒，请保持当前 Frame 选中。";
        renderCatalogActions();
        parent.postMessage(
          {
            pluginMessage: {
              type: "page.seed.capture",
              pageId: page.id,
              sourceHash: page.sourceHash,
              requestId: activeSeedRequestId,
              pageSeedTransportVersion,
            },
          },
          "*",
        );
      });

      importPageButton.addEventListener("click", () => {
        const page = catalogPages.find((candidate) => candidate.id === activePageId);
        if (!page || socket?.readyState !== WebSocket.OPEN) return;
        activeImportRequest = true;
        setStatus("connected", "正在把 Codex 页面发送到 Figma…");
        statusDetail.textContent = "已接收操作，正在生成可编辑图层";
        resultElement.textContent = "正在把 Codex 页面发送到 Figma…";
        renderCatalogActions();
        send({ type: "page.import.request", pageIds: [page.id] });
      });

      captureButton.addEventListener("click", () => {
        captureButton.disabled = true;
        if (localWorkspace) {
          captureButton.textContent = "正在发送…";
          setStatus("connected", "正在读取 Figma 修改…");
          statusDetail.textContent = "页面保持可见，不需要等待加载界面";
          parent.postMessage(
            { pluginMessage: { type: "review.capture" } },
            "*",
          );
        } else {
          captureButton.textContent = "Capturing design…";
          parent.postMessage({ pluginMessage: { type: "design.capture" } }, "*");
        }
      });

      resetWorkspaceButton.addEventListener("click", () => {
        const confirmed = window.confirm(
          "确定清除 Figma 中的 CDB 关联数据？\n\n页面关联、传输记录和待发送修改会被清空；Codex 项目、源码和 Figma 画布内容都会保持原样。清除后可从当前项目页面目录重新建立关联。",
        );
        if (!confirmed) return;
        resetWorkspaceButton.disabled = true;
        resetWorkspaceButton.textContent = "清除中…";
        resultElement.textContent = "正在清空当前 CDB 任务…";
        send({ type: "workspace.reset.request" });
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "plugin.settings") {
          endpoint = message.endpoint || endpoint;
          token = message.token || "";
          if (token) {
            shouldReconnect = true;
            connect();
          } else {
            shouldReconnect = true;
            autoPair();
          }
          return;
        }
        if (message.type === "plugin.ready") {
          for (const assetId of message.importedAssetIds || []) {
            importedAssets.add(assetId);
          }
          for (const pageId of message.importedPageIds || []) {
            importedPages.add(pageId);
          }
          unsentChanges = Boolean(message.unsentChanges);
          changedPageIds = message.changedPageIds || [];
          appendLog(`Figma ready · ${message.pageName}`);
          return;
        }
        if (message.type === "workspace.reset.complete") {
          importedAssets.clear();
          importedPages.clear();
          changedPageIds = [];
          unsentChanges = false;
          resetWorkspaceButton.textContent = "清除关联";
          setConnectedStatus();
          statusDetail.textContent = "关联已清空 · 当前项目页面目录已恢复";
          resultElement.textContent = "请选择页面重新建立 Figma → Codex 或 Codex → Figma 关联。";
          renderCatalog();
          return;
        }
        if (message.type === "page.changes.status") {
          unsentChanges = Boolean(message.unsentChanges);
          changedPageIds = message.changedPageIds || [];
          send({
            type: "page.changes.status",
            unsentChanges,
            changedPageIds: message.changedPageIds || [],
          });
          if (localWorkspace && socket?.readyState === WebSocket.OPEN) {
            captureButton.textContent = "发送修改给 Codex";
            statusDetail.textContent = unsentChanges
              ? "有尚未发送的修改"
              : "当前修改已发送";
          }
          return;
        }
        if (message.type === "page.result") {
          if (message.ok) {
            importedPages.add(message.pageId);
            pageCount.textContent = String(importedPages.size);
            appendLog(
              `${message.reused ? "Reused" : "Imported"} page ${message.pageId} · ${message.nodes} nodes`,
            );
          } else {
            appendLog(
              `Page import failed ${message.pageId}: ${message.error}` +
                (message.rolledBack ? " · previous version kept" : ""),
            );
          }
          renderCatalogActions();
          send({ type: "page.import.result", result: message });
          return;
        }
        if (message.type === "asset.result") {
          if (message.ok) {
            importedAssets.add(message.assetId);
            assetCount.textContent = String(importedAssets.size);
            appendLog(`Imported ${message.assetId} · ${message.elements} targets`);
          } else {
            appendLog(
              `Import failed ${message.assetId}: ${message.error}` +
                (message.rolledBack ? " · previous version kept" : ""),
            );
          }
          return;
        }
        if (message.type === "feedback.emit") {
          send({
            type: "feedback.record",
            requestId: message.requestId,
            feedback: message.feedback,
          });
          return;
        }
        if (message.type === "page.changes.emit") {
          const changeCount =
            (message.changeSet?.changes?.length || 0) +
            (message.changeSet?.annotations?.length || 0);
          send({
            type: "page.changes.record",
            requestId: message.requestId,
            changeSet: message.changeSet,
          });
          resultElement.textContent = `已找到 ${changeCount} 处修改，正在写入页面…`;
          return;
        }
        if (
          message.type === "page.seed.begin" ||
          message.type === "page.seed.chunk" ||
          message.type === "page.seed.complete"
        ) {
          send(message);
          if (message.type === "page.seed.begin") {
            resultElement.textContent =
              `正在安全传输 ${message.nodeCount || 0} 个节点（${message.chunkCount || 0} 个分块）…`;
          } else if (message.type === "page.seed.chunk") {
            resultElement.textContent = `正在传输页面分块 ${Number(message.index || 0) + 1}…`;
          } else {
            resultElement.textContent = "传输完成，正在原子写入页面…";
          }
          return;
        }
        if (message.type === "page.changes.empty") {
          send({
            type: "page.changes.empty",
            requestId: message.requestId || null,
          });
          if (localWorkspace) {
            captureButton.disabled = false;
            captureButton.textContent = "发送修改给 Codex";
            setStatus("connected", "没有新的修改");
            statusDetail.textContent = "继续在 Figma 中调整即可";
            resultElement.textContent = "当前设计与上次发送时一致。";
          }
          return;
        }
        if (message.type === "design.submit") {
          activeTaskId = message.requestId;
          captureButton.textContent = "Submitting…";
          send({
            type: "design.generate",
            requestId: message.requestId,
            design: message.design,
          });
          return;
        }
        if (message.type === "page.changes.complete") {
          send({
            type: "page.changes.complete",
            requestId: message.requestId || null,
            count: message.count || 0,
          });
          return;
        }
        if (message.type === "notice") {
          appendLog(message.message);
          return;
        }
        if (message.type === "plugin.error") {
          if (message.requestId === activeSeedRequestId) {
            activeSeedRequestId = "";
          }
          activeImportRequest = false;
          appendLog(`Plugin error: ${message.error}`);
          captureButton.disabled = false;
          captureButton.textContent = "重新发送";
          setStatus("error", "这次没有发送成功");
          statusDetail.textContent = "可以直接重试，不会重复修改代码";
          resultElement.textContent = message.error;
          renderCatalogActions();
        }
      };

      function connect() {
        clearTimeout(reconnectTimer);
        if (socket) {
          socket.onclose = null;
          socket.close();
        }

        const nextEndpoint = endpoint.trim();
        const nextToken = token.trim();
        if (!nextEndpoint || !nextToken) {
          autoPair();
          return;
        }

        parent.postMessage(
          {
            pluginMessage: {
              type: "settings.save",
              endpoint: nextEndpoint,
              token: nextToken,
            },
          },
          "*",
        );
        setStatus("", connectedProjectName
          ? `正在连接 · ${connectedProjectName}`
          : "正在连接 Codex…");

        const separator = nextEndpoint.includes("?") ? "&" : "?";
        socket = new WebSocket(`${nextEndpoint}${separator}token=${encodeURIComponent(nextToken)}`);
        socket.onopen = () => {
          clearTimeout(pairingTimer);
          sessionEnded = false;
          setConnectedStatus();
          captureButton.disabled = false;
          resetWorkspaceButton.disabled = false;
          manageProjectsButton.disabled = false;
          send({
            type: "plugin.hello",
            protocolVersion: 14,
            pluginVersion: FIGMA_PLUGIN_VERSION,
            importedAssetIds: [...importedAssets],
            importedPageIds: [...importedPages],
            unsentChanges,
            changedPageIds,
          });
          appendLog("Connected to local bridge");
        };
        socket.onmessage = (event) => handleBridgeMessage(JSON.parse(event.data));
        socket.onerror = () => {
          setStatus("error", "暂时无法连接 Codex");
          statusDetail.textContent = "正在自动重连";
        };
        socket.onclose = () => {
          if (activeSeedRequestId) {
            parent.postMessage(
              { pluginMessage: { type: "page.seed.abort", requestId: activeSeedRequestId } },
              "*",
            );
            activeSeedRequestId = "";
          }
          activeImportRequest = false;
          captureButton.disabled = true;
          resetWorkspaceButton.disabled = true;
          manageProjectsButton.disabled = true;
          setStatus(
            "",
            sessionEnded ? "本次设计已结束" : "等待 Codex 页面…",
          );
          statusDetail.textContent = sessionEnded
            ? "开始新设计后会自动连接"
            : "打开对应的 Codex 设计任务后会自动连接";
          if (shouldReconnect) {
            pairingTimer = setTimeout(autoPair, 1500);
          }
        };
      }

      async function autoPair() {
        clearTimeout(pairingTimer);
        if (!shouldReconnect) return;
        setStatus("", "正在寻找 Codex 页面…");
        try {
          const response = await fetch("http://localhost:9847/api/pair", {
            cache: "no-store",
          });
          if (!response.ok) throw new Error("Workspace not ready");
          const pairing = await response.json();
          if (!pairing.token || !pairing.wsUrl) {
            throw new Error("Invalid pairing response");
          }
          endpoint = pairing.wsUrl;
          token = pairing.token;
          connectedProjectName = String(pairing.projectName || "");
          connectedProjectKey = String(pairing.projectKey || "");
          renderCatalog();
          connect();
        } catch {
          pairingTimer = setTimeout(autoPair, 1500);
        }
      }

      function handleBridgeMessage(message) {
        if (message.type === "plugin.ready") {
          localWorkspace = Boolean(message.localWorkspace);
          pageSeedTransportVersion = Number(message.pageSeedTransportVersion || 0);
          connectedProjectName = String(message.projectName || connectedProjectName);
          connectedProjectKey = String(message.projectKey || connectedProjectKey);
          connectedProjectDir = String(message.projectDir || connectedProjectDir);
          projectActionPending = false;
          projectPathElement.textContent = connectedProjectDir;
          projectPathElement.title = connectedProjectDir;
          assetCount.textContent = String(message.assets || 0);
          pageCount.textContent = String(message.pages || 0);
          if (message.codexRunner?.runningTaskId) {
            captureButton.disabled = true;
            captureButton.textContent = "Codex 正在更新…";
            setStatus("connected", "Codex 正在更新页面");
          } else {
            activeTaskId = null;
            captureButton.disabled = false;
            captureButton.textContent = localWorkspace
              ? "发送修改给 Codex"
              : "发送设计给 Codex";
            setConnectedStatus();
          }
          resetWorkspaceButton.disabled = !localWorkspace;
          manageProjectsButton.disabled = !localWorkspace;
          renderProjectCatalog();
          if (projectDialog.open) {
            projectStatus.textContent = `已打开 ${connectedProjectName || "CDB 项目"}。`;
            send({ type: "project.catalog.request" });
          }
          renderCatalog();
          if (message.projectName) {
            appendLog(`Project ready: ${message.projectName}`);
          }
          if (message.runtimeVersion) {
            appendLog(`CDB runtime: ${message.runtimeVersion}`);
          }
          return;
        }
        if (message.type === "design.task") {
          const task = message.task;
          if (!task) return;
          activeTaskId = task.taskId || activeTaskId;
          if (task.state === "queued") {
            captureButton.disabled = true;
            captureButton.textContent = "等待 Codex…";
            appendLog(`Queued Codex task ${task.taskId}`);
          } else if (task.state === "running") {
            captureButton.disabled = true;
            captureButton.textContent = "Codex 正在更新…";
            setStatus("connected", "Codex 正在更新页面");
            appendLog(`Codex started ${task.taskId}`);
          } else if (task.state === "completed") {
            captureButton.disabled = false;
            captureButton.textContent = "发送修改给 Codex";
            setStatus("connected", "页面代码已更新");
            if (!completedTasks.has(task.taskId)) {
              completedTasks.add(task.taskId);
              feedbackSaved += 1;
              feedbackCount.textContent = String(feedbackSaved);
            }
            appendLog(`Code updated · ${task.lastMessagePath || task.taskId}`);
          } else if (task.state === "failed") {
            captureButton.disabled = false;
            captureButton.textContent = "重新发送";
            setStatus("error", "Codex 更新失败");
            appendLog(`Codex failed: ${task.error || "Unknown error"}`);
          }
          return;
        }
        if (message.type === "asset.upsert") {
          parent.postMessage(
            { pluginMessage: { type: "asset.upsert", asset: message.asset } },
            "*",
          );
          return;
        }
        if (message.type === "asset.remove") {
          importedAssets.delete(message.assetId);
          assetCount.textContent = String(importedAssets.size);
          parent.postMessage(
            { pluginMessage: { type: "asset.remove", assetId: message.assetId } },
            "*",
          );
          return;
        }
        if (message.type === "asset.error") {
          appendLog(`Rejected ${message.assetId}: ${message.error}`);
          return;
        }
        if (message.type === "page.upsert") {
          parent.postMessage(
            { pluginMessage: { type: "page.upsert", page: message.page } },
            "*",
          );
          return;
        }
        if (message.type === "page.catalog") {
          catalogPages = Array.isArray(message.pages) ? message.pages : [];
          if (!catalogPages.some((page) => page.id === activePageId)) {
            activePageId = catalogPages[0]?.id || "";
          }
          renderCatalog();
          return;
        }
        if (message.type === "page.import.request.result") {
          activeImportRequest = false;
          if (message.ok) {
            setStatus("connected", "Codex 页面已发送");
            statusDetail.textContent = "正在 Figma 中生成可编辑图层";
            resultElement.textContent = "生成完成后页面状态会自动变为已同步。";
          } else {
            setStatus("error", "Codex 页面没有发送成功");
            statusDetail.textContent = "可以直接重试";
            resultElement.textContent = message.error || "页面发送失败。";
          }
          renderCatalogActions();
          return;
        }
        if (message.type === "workspace.reset.result") {
          if (!message.ok) {
            resetWorkspaceButton.disabled = false;
            resetWorkspaceButton.textContent = "清除关联";
            resultElement.textContent = message.error || "关联数据清除失败。";
            return;
          }
          parent.postMessage(
            { pluginMessage: { type: "workspace.reset" } },
            "*",
          );
          catalogPages = Array.isArray(message.pages) ? message.pages : catalogPages;
          if (!catalogPages.some((page) => page.id === activePageId)) {
            activePageId = catalogPages[0]?.id || "";
          }
          return;
        }
        if (message.type === "project.catalog") {
          projectCatalog = Array.isArray(message.projects) ? message.projects : [];
          projectActionPending = false;
          projectStatus.textContent = projectCatalog.length
            ? "选择一个项目进行切换。"
            : "还没有登记的 CDB 项目。";
          renderProjectCatalog();
          return;
        }
        if (message.type === "project.action.result") {
          if (!message.ok) {
            projectActionPending = false;
            projectStatus.textContent = message.error || "项目操作没有完成。";
            renderProjectCatalog();
            return;
          }
          if (message.cancelled) {
            projectActionPending = false;
            projectStatus.textContent = "已取消，没有创建任何文件。";
            renderProjectCatalog();
            return;
          }
          projectStatus.textContent = message.reconnecting
            ? "项目已选择，正在重新连接…"
            : "当前项目已经打开。";
          if (!message.reconnecting) {
            projectActionPending = false;
            renderProjectCatalog();
          }
          return;
        }
        if (message.type === "page.changes.request") {
          parent.postMessage(
            {
              pluginMessage: {
                type: "review.capture",
                requestId: message.requestId || null,
              },
            },
            "*",
          );
          return;
        }
        if (message.type === "page.remove") {
          importedPages.delete(message.pageId);
          pageCount.textContent = String(importedPages.size);
          parent.postMessage(
            { pluginMessage: { type: "page.remove", pageId: message.pageId } },
            "*",
          );
          return;
        }
        if (message.type === "page.error") {
          appendLog(`Rejected page ${message.pageId}: ${message.error}`);
          return;
        }
        if (message.type === "feedback.ack") {
          appendLog(
            `${message.state === "conflict" ? "Conflict" : "Saved"} feedback · ${message.path}`,
          );
          return;
        }
        if (message.type === "page.changes.ack") {
          parent.postMessage(
            {
              pluginMessage: {
                type: "page.changes.accepted",
                pageId: message.pageId || null,
                sourceHash: message.sourceHash || null,
                previousSourceHash: message.previousSourceHash || null,
                changeSetId: message.changeSetId || null,
                state: message.state || null,
              },
            },
            "*",
          );
          appendLog(
            `${message.state === "conflict" ? "Conflict" : "Saved"} page changes · ${message.path}`,
          );
          const fastApply = message.fastApply || {};
          const appliedCount = fastApply.appliedCount || 0;
          const pendingCount = fastApply.pendingCount || 0;
          const seconds = Math.max(
            0.1,
            (fastApply.durationMs || 0) / 1000,
          ).toFixed(1);
          captureButton.disabled = false;
          unsentChanges = false;
          captureButton.textContent = "继续发送修改";
          const isActiveSeed =
            Boolean(activeSeedRequestId) &&
            message.requestId === activeSeedRequestId;
          if (isActiveSeed) {
            activeSeedRequestId = "";
            if (message.state === "applied") {
              setStatus("connected", "Figma 页面已生成");
              statusDetail.textContent = "整页已一次性写入 Codex 源码";
              resultElement.textContent =
                `${fastApply.changedFiles?.join("、") || "页面文件"} · ${seconds} 秒`;
            } else {
              setStatus("error", "页面没有写入");
              statusDetail.textContent = "源码保持原样，可以直接重试";
              resultElement.textContent =
                fastApply.error || fastApply.pending?.[0]?.reason || "页面写入未完成。";
            }
            renderCatalogActions();
            return;
          }
          if (appliedCount > 0 && pendingCount === 0) {
            setStatus("connected", `已更新 ${appliedCount} 处修改`);
            statusDetail.textContent = "Codex 页面代码已经保存";
            resultElement.textContent = `${fastApply.changedFiles?.join("、") || "页面文件"} · ${seconds} 秒`;
          } else if (appliedCount > 0) {
            setStatus("connected", `已更新 ${appliedCount} 处修改`);
            statusDetail.textContent = `另有 ${pendingCount} 处交给 Codex 处理`;
            resultElement.textContent = "页面不会阻塞，可以继续设计。";
          } else {
            setStatus("connected", `已发送 ${pendingCount} 处修改`);
            statusDetail.textContent = "这些结构修改将由 Codex 处理";
            resultElement.textContent = "页面不会阻塞，可以继续设计。";
          }
          return;
        }
        if (message.type === "page.seed.result") {
          parent.postMessage(
            {
              pluginMessage: {
                type: "page.seed.abort",
                changeSetId: message.changeSetId || null,
              },
            },
            "*",
          );
          activeSeedRequestId = "";
          setStatus("error", "页面没有写入");
          statusDetail.textContent = "源码保持原样，可以直接重试";
          resultElement.textContent = message.error || "页面分块传输失败。";
          renderCatalogActions();
          return;
        }
        if (message.type === "session.ended") {
          sessionEnded = true;
          localWorkspace = false;
          catalogPages = [];
          activePageId = "";
          renderCatalog();
          captureButton.disabled = true;
          resetWorkspaceButton.disabled = true;
          manageProjectsButton.disabled = true;
          captureButton.textContent = "本次设计已结束";
          setStatus("", "本次设计已结束");
          statusDetail.textContent = "开始新设计后会自动连接";
          resultElement.textContent =
            "如有尚未发送的修改，它们仍保留在当前 Figma 文件中。";
          return;
        }
        if (message.type === "bridge.error") {
          if (activeSeedRequestId) {
            parent.postMessage(
              { pluginMessage: { type: "page.seed.abort", requestId: activeSeedRequestId } },
              "*",
            );
            activeSeedRequestId = "";
          }
          activeImportRequest = false;
          appendLog(`Bridge error: ${message.error}`);
          captureButton.disabled = false;
          captureButton.textContent = "重新发送";
          setStatus("error", "这次没有发送成功");
          statusDetail.textContent = "连接仍会自动恢复";
          resultElement.textContent = message.error || "请直接重试。";
        }
      }

      function send(value) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          appendLog("Feedback not sent: bridge is disconnected");
          return;
        }
        socket.send(JSON.stringify(value));
      }

      function renderCatalog() {
        catalogCount.textContent = sessionEnded
          ? "已结束"
          : connectedProjectName
            ? `${connectedProjectName} · ${catalogPages.length} 个`
            : `${catalogPages.length} 个`;
        catalogList.replaceChildren();
        for (const page of catalogPages) {
          const row = document.createElement("div");
          row.className = `page-row${page.id === activePageId ? " active" : ""}`;
          const copy = document.createElement("span");
          copy.className = "page-copy";
          const name = document.createElement("strong");
          name.textContent = page.name || page.id;
          const route = document.createElement("span");
          route.textContent = page.entry
            ? `${page.entry} · ${page.route || "/"}`
            : page.route || "/";
          copy.append(name, route);
          const state = document.createElement("span");
          state.className = `page-state ${page.state || "not_imported"}`;
          state.textContent = stateLabel(page.state);
          state.title = stateDescription(page.state);
          row.append(copy, state);
          row.addEventListener("click", () => {
            activePageId = page.id;
            renderCatalog();
            if (page.state !== "not_imported") {
              parent.postMessage(
                { pluginMessage: { type: "page.locate", pageId: page.id } },
                "*",
              );
            }
          });
          catalogList.append(row);
        }
        if (catalogPages.length === 0) {
          const empty = document.createElement("div");
          empty.className = "page-row";
          empty.textContent = sessionEnded
            ? "任务已结束，开始新设计后刷新页面列表"
            : "当前项目没有可用页面";
          catalogList.append(empty);
        }
        renderCatalogActions();
      }

      function renderProjectCatalog() {
        projectList.replaceChildren();
        for (const project of projectCatalog) {
          const row = document.createElement("div");
          row.className = `project-row${project.projectKey === connectedProjectKey ? " active" : ""}`;
          const copy = document.createElement("span");
          copy.className = "project-copy";
          const name = document.createElement("strong");
          name.textContent = project.name || project.projectId || "CDB 项目";
          const location = document.createElement("span");
          location.textContent = project.projectDir || "本地位置不可用";
          location.title = project.projectDir || "";
          copy.append(name, location);
          const action = document.createElement("button");
          action.className = project.projectKey === connectedProjectKey ? "secondary" : "";
          action.textContent = project.projectKey === connectedProjectKey
            ? "当前"
            : project.status === "available"
              ? "打开"
              : "失效";
          action.disabled =
            projectActionPending ||
            project.projectKey === connectedProjectKey ||
            project.status !== "available";
          action.dataset.projectKey = project.projectKey || "";
          row.append(copy, action);
          projectList.append(row);
        }
        if (!projectCatalog.length) {
          const empty = document.createElement("div");
          empty.className = "project-row";
          empty.textContent = "还没有登记的 CDB 项目";
          projectList.append(empty);
        }
        createProjectButton.disabled = projectActionPending;
      }

      function renderCatalogActions() {
        const activePage = catalogPages.find((page) => page.id === activePageId);
        const hasFigmaLinks =
          importedPages.size > 0 ||
          catalogPages.some((page) => page.state && page.state !== "not_imported");
        const isUnlinked =
          localWorkspace &&
          activePage?.state === "not_imported";
        const canSeed = isUnlinked && activePage?.acceptsFigmaSeed;
        const actionPending = Boolean(activeSeedRequestId) || activeImportRequest;
        seedPageButton.hidden = !canSeed;
        seedPageButton.disabled = !canSeed || actionPending;
        seedPageButton.textContent = activeSeedRequestId
          ? "处理中…"
          : "Figma → Codex";
        importPageButton.hidden = !isUnlinked;
        importPageButton.disabled = !isUnlinked || actionPending;
        importPageButton.textContent = activeImportRequest
          ? "发送中…"
          : "Codex → Figma";
        resetWorkspaceButton.disabled = !localWorkspace || !hasFigmaLinks;
        if (localWorkspace && !activeTaskId) {
          captureButton.disabled = !hasFigmaLinks;
        }
      }

      function stateLabel(state) {
        return {
          not_imported: "未导入",
          synced: "已同步",
          source_changed: "源码更新",
          figma_changed: "Figma 修改",
          conflict: "两边均有修改",
          failed: "失败",
        }[state] || "未导入";
      }

      function stateDescription(state) {
        return {
          not_imported: "尚未建立同步；可选择 Figma → Codex 或 Codex → Figma",
          synced: "源码与 Figma 处于同一同步版本",
          source_changed: "源码在上次同步后发生了修改",
          figma_changed: "Figma 在上次同步后发生了修改",
          conflict: "源码和 Figma 在上次同步后都发生了修改，请先确认要保留哪一侧",
          failed: "最近一次页面操作失败",
        }[state] || "";
      }

      function setStatus(kind, text) {
        statusDot.className = `dot ${kind}`;
        statusText.textContent = text;
      }

      function setConnectedStatus() {
        const label = connectedProjectName || "Codex";
        const shortKey = connectedProjectKey.slice(0, 8);
        setStatus("connected", `已连接 · ${label}`);
        statusDetail.textContent = shortKey
          ? `当前唯一活动工作台 · ${shortKey}`
          : "当前唯一活动工作台";
        projectPathElement.textContent = connectedProjectDir;
        projectPathElement.title = connectedProjectDir;
        manageProjectsButton.disabled = false;
      }

      function appendLog(message) {
        const time = new Date().toLocaleTimeString();
        logElement.textContent = `${time}  ${message}\n${logElement.textContent}`.slice(
          0,
          5000,
        );
      }
    </script>
  </body>
</html>
